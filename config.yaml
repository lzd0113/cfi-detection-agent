# CFI Agent 配置 — 改完重启 agent 生效
# 首次运行 cfi.bat 会自动引导选择大模型并输入 API Key

llm:
  # 模型字符串带 provider 前缀，换模型只改这里 + 对应 .env 的 key
  # 首次运行会自动弹出选择列表，选完自动写入此处
  # 可选：openai/gpt-4o-mini | deepseek/deepseek-chat | qwen/qwen-plus | zhipu/glm-4 | moonshot/moonshot-v1-8k | ollama
  model: deepseek/deepseek-chat
  temperature: 0.3

defaults:
  # 默认检测输入目录（未 strip 的 .so 集合路径）
  # 留空则在对话中手动指定，如"对 E:/xxx 做检测"
  lib_dir: ""
  output_dir: ./output

skills:
  paths: ["skills"]
